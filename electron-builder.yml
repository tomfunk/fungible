appId: com.tomfunk.fungible
productName: Fungible
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# out/ is self-contained (electron-vite bundles gui/ + core/); everything else
# in the repo is TUI/MCP/API source that the packaged app never loads.
files:
  - '!**/*.{ts,tsx,map}'
  - '!{tui,core,mcp,api,gui,tests,scripts,docs,dist,memory,build,release}/**'
  - '!{electron.vite.config.ts,vitest.config.ts,tsconfig.json,PLANS.md,CONTRIBUTING.md,README.md,logo.png}'
  - '!.env*'
  - '!**/*.{db,sqlite}'
  # TUI/MCP-only production deps — not used by the GUI main process
  - '!node_modules/{ink,tsx,react,react-devtools-core,yoga-layout,esbuild}/**'
  - '!node_modules/@esbuild/**'
  - '!node_modules/@modelcontextprotocol/**'

# libsql native binding can't load from inside the asar archive
asarUnpack:
  - '**/*.node'

# libsql ships prebuilt binaries; nothing needs rebuilding against Electron's ABI
npmRebuild: false

mac:
  # Without this, electron-builder finds no Developer ID cert in CI, skips
  # signing entirely, and ships the .app carrying only the linker-signed ad-hoc
  # signature Electron's prebuilt binary came with. That signature no longer
  # matches the repacked bundle, so Gatekeeper rejects a quarantined download
  # outright with "damaged and can't be opened" — a dead end with no "Open
  # Anyway" escape hatch (issue #144). '-' re-signs the finished bundle ad-hoc,
  # which verifies cleanly; the download still warns (unnotarized), but the
  # warning is the dismissable kind. Real fix is a Developer ID + notarization.
  identity: '-'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.finance

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: thomasfunk10@gmail.com
  synopsis: Personal finance dashboard
  desktop:
    entry:
      Name: Fungible
      StartupWMClass: Fungible

publish:
  provider: github
  owner: tomfunk
  repo: fungible
