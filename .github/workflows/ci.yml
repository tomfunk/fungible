name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - run: npm run typecheck

      - run: npm run test:coverage

      # Reporting only: no thresholds. Tolerates a missing summary (e.g. the
      # suite crashed before coverage was written).
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = "coverage/coverage-summary.json";
            if (!fs.existsSync(f)) { console.log("No coverage summary found."); process.exit(0); }
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            const pct = (x) => (x ? x.pct : 0).toFixed(1) + "%";
            const t = j.total;
            const areas = ["core", "api", "mcp", "tui", "gui"];
            const sums = {};
            for (const [file, m] of Object.entries(j)) {
              if (file === "total") continue;
              const rel = file.replace(process.cwd() + "/", "");
              const a = rel.split("/")[0];
              if (!areas.includes(a)) continue;
              const s = (sums[a] ||= { total: 0, covered: 0 });
              s.total += m.lines.total; s.covered += m.lines.covered;
            }
            const NL = String.fromCharCode(10);
            let out = ["### Coverage", "", "| Metric | Overall |", "|---|---|"];
            for (const k of ["lines", "statements", "branches", "functions"]) out.push("| " + k + " | " + pct(t[k]) + " |");
            out.push("", "| Area | Lines |", "|---|---|");
            for (const a of areas) { const s = sums[a]; out.push("| " + a + " | " + (s && s.total ? (100 * s.covered / s.total).toFixed(1) + "%" : "n/a") + " |"); }
            out = out.join(NL) + NL;
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            console.log(out);
          '

  # Boot the real Electron app and assert it comes up. Complements the unit suite
  # (which stubs window.__bridge entirely) by exercising what only a live process
  # can: main-process boot, @libsql native-binding loading, the electron-vite
  # build-output wiring, the sandboxed-preload contextBridge, and the real
  # ipcRenderer→ipcMain serialization in gui/main/bridge.ts.
  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      # Electron's renderer is Chromium and needs the same system libraries; this
      # installs that dependency set on the bare runner image.
      - run: npx playwright install-deps chromium

      # xvfb-run gives Electron the virtual X display the headless runner lacks.
      - run: xvfb-run -a npm run test:e2e

  # Smoke-build the unpacked Electron app on each platform when something is
  # about to land on main — catches packaging regressions (missing deps,
  # broken file filters, native-binding paths) before a release tag is cut.
  gui-build:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/build-gui.yml
    with:
      mode: dir

  # Aggregator: branch protection requires only this one check name instead of
  # listing every matrix leg of gui-build individually. gui-build is "skipped"
  # on PRs that don't target main — treat skipped as passing so dev PRs still
  # merge with just test green.
  ci-all-passed:
    needs: [test, gui-e2e, gui-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test job failed"
            exit 1
          fi
          if [ "${{ needs.gui-e2e.result }}" != "success" ]; then
            echo "::error::gui-e2e job failed"
            exit 1
          fi
          if [ "${{ needs.gui-build.result }}" != "success" ] && [ "${{ needs.gui-build.result }}" != "skipped" ]; then
            echo "::error::gui-build matrix failed"
            exit 1
          fi
          echo "All required jobs passed."
