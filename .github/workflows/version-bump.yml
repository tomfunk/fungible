name: Version Bump

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          NON_DOCS=$(echo "$CHANGED" | grep -v -E '^(docs/|\.github/|.*\.md$)' || true)

          if [ -z "$NON_DOCS" ]; then
            echo "📄 Docs-only change — skipping version bump check."
            exit 0
          fi

          BASE_VERSION=$(git show origin/main:package.json | jq -r '.version')
          PR_VERSION=$(jq -r '.version' package.json)

          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "❌ Version not bumped: still $PR_VERSION"
            echo "Bump the version in package.json before merging to main."
            exit 1
          fi

          echo "✅ Version bumped: $BASE_VERSION → $PR_VERSION"
